; F4Parkour — code-driven vaulting and mantling.
; Everything here is editable in game through the F4SE Menu Framework
; (F4Parkour section); the menu writes this file on Save.
;
; Vault = climb up and OVER (momentum kept).
; Mantle = climb up and ON TOP (momentum cleared).
; Heights are game units: 70 units = ~1 meter, player eye height = ~108.

[General]
bEnabled = true
; Fire the melee action during moves so Open Animation Replacer can swap
; in a vault/mantle animation (HasKeyword AnimsParkourVaultKeyword /
; AnimsParkourMantleKeyword / AnimsParkourKeyword). OFF = movement only.
bPlayMeleeAnim = true
bAutoParkourWhileSprinting = false
bAutoStepUp = false
bAllowInAir = true
bAllowThirdPerson = true
bRequireForwardInput = true
fLookConeDegrees = 35
fDetectionInterval = 0.05
sActivePreset = Smooth

[Input]
fJumpBufferWindow = 0.20
fCoyoteWindow = 0.15
bHoldToMantle = false

[Detection]
fMinVaultHeight = 40
fMaxVaultHeight = 110
fMinMantleHeight = 40
fMaxMantleHeight = 200
fMinMantleDepth = 25
fMinBackClearance = 40
fMaxVaultDrop = 140
fMaxApproachAngle = 45
fAutoEngageDistance = 60
fAirGrabExtraReach = 80

[Movement]
fMomentumKeep = 1.0
fExitDirectionBlend = 0.5
fMomentumDropCutoff = 100
fControlHandbackFraction = 0.25
bSneakOnCrouchOnlyMantle = true

[Comfort]
bFocusDot = true
fFocusDotAlpha = 0.35

[Testing]
; Per tier: play a raw idle .hkx (PlayIdle) at move start instead of the
; melee action - iterate animations without OAR configs. Path is relative
; to Data/Meshes.
bTestIdleVaultLow = false
bTestIdleVaultMid = false
bTestIdleVaultHigh = false
bTestIdleMantleLow = false
bTestIdleMantleMid = false
bTestIdleMantleHigh = false
sTestIdlePath = Meshes\Actors\Character\Animations\F4Parkour\Ledge.hkx
; Dynamic-idle anim event the file plays through. dyn_Activation =
; one-shot, dyn_ActivationLoop = looping. Uses the weapon-inspect engine
; path (SetupSpecialIdle), so first-person playback works when the .hkx
; is authored for the first-person rig.
sTestIdleEvent = dyn_ActivationAllowMovement
; First-person behavior graph the idle routes through (from the
; Inspectweapons.esl recipe - required or the engine refuses the idle).
sTestIdleBehavior = actors\Character\_1stPerson\Behaviors\RootBehavior.hkx

; Second idle slot: same as above, but it also SKIPS the fast-equip that
; normally plays when the idle ends (SeamlessInspect technique). Defaults
; to Mantle.hkx. Wins over the first slot on a tier that has both on.
bTestIdle2VaultLow = false
bTestIdle2VaultMid = false
bTestIdle2VaultHigh = false
bTestIdle2MantleLow = false
bTestIdle2MantleMid = false
bTestIdle2MantleHigh = false
sTestIdle2Path = Meshes\Actors\Character\Animations\F4Parkour\Vault.hkx
sTestIdle2Event = dyn_ActivationAllowMovement

[Debug]
bDebugEnabled = false
bDrawRays = true
bDrawPath = true
bDrawOnlyFailed = false
bFreezeDetection = false
fMoverTimeScale = 1.0
bWatchdogEnabled = true
